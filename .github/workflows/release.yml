name: Release

# Publishes the @opsinjs packages to npm. RELEASING.md is the procedure.
#
# On every push to main, changesets/action does one of two things:
#   - If unreleased changesets are on main, it opens or updates the pull
#     request "chore(release): version packages", which bumps the four
#     packages together and writes their CHANGELOG.md entries.
#   - If none are, which is the state right after that pull request merges,
#     it runs `pnpm release`. That builds the packages, runs the package checks
#     and the pack-and-consume smoke test, and then `changeset publish`
#     publishes every package version not yet on npm, tags it and creates the
#     GitHub release.
#
# Publishing uses npm trusted publishing: pnpm exchanges this job's OIDC token
# for a short-lived npm token, so no npm token is stored anywhere, and npm
# records provenance that names this workflow run. Each package must list this
# repository and this workflow file as its trusted publisher on npmjs.com.
#
# Every action is pinned to a full commit SHA, with its release in a comment.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two releases at once, and never cancel one halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version pull request, or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
