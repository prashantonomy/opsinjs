name: Documentation problem
description: A docs page is wrong, missing, unclear, stale or broken.
title: "docs: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        If the page could lead a product to mislead somebody about their own health, use the safety concern form instead. Those are triaged first.

        The Page and Docs version fields are filled in for you when you arrive from a docs page.

  - type: input
    id: page
    attributes:
      label: Page
      description: The address or the file, for example `/health/two-colour-axes` or `apps/www/content/docs/health/two-colour-axes.mdx`.
      placeholder: /components/button
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Wrong. The page states something that is not true
        - Missing. The page does not answer a question it should
        - Unclear. The answer is there but hard to find or follow
        - Stale. The page describes something that has changed
        - Broken. A link, a code block, an example or a table does not work
        - Machine surface. llms.txt, a .md twin or /r
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the sentence or the table row. If something is missing, say what question you came with.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What would fix it
      description: Optional. If you know the right answer, write it here in your own words.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence, for a health or accessibility claim
      description: A link, a standard and its clause, or the device you tested with. Say when it is opinion. Cite NHS or other Crown copyright text rather than pasting it.

  - type: input
    id: version
    attributes:
      label: Docs version
      placeholder: 0.0.0
