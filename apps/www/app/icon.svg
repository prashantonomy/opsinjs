<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="opsinjs">
  <title>opsinjs</title>
  <!--
    The mark is a value read against a range: a track, a band that is expected,
    and one marker sitting outside it. It is the RangeBar, which is the argument
    the whole system makes — a health number means nothing until you can see
    where it falls and what that means.

    Static, not generated. Two flat colours, no gradient, no text: it has to
    survive being drawn at 16 pixels in a browser tab next to twenty others.
  -->
  <rect width="32" height="32" rx="7" fill="#17181A"/>
  <rect x="6" y="14.5" width="20" height="3" rx="1.5" fill="#3F4145"/>
  <rect x="6" y="14.5" width="11" height="3" rx="1.5" fill="#7FB77A"/>
  <circle cx="22" cy="16" r="4" fill="#17181A"/>
  <circle cx="22" cy="16" r="2.75" fill="#E08A3C"/>
</svg>
